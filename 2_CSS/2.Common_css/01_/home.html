<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL FLEXBOX PROPERTIES</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
        }

        /* FLEX CONTAINER PROPERTIES */
        #container {
            width: 90%;
            min-height: 350px;
            border: 3px solid red;
            padding: 10px;
            margin: 20px auto;

            display: flex;
            /* ENABLE FLEXBOX */

            flex-direction: row;
            /* row | row-reverse | column | column-reverse */

            flex-wrap: wrap;
            /* nowrap | wrap | wrap-reverse */

            flex-flow: row wrap;
            /* shorthand for flex-direction + flex-wrap */

            justify-content: center;
            /* flex-start | flex-end | center | space-between | space-around | space-evenly */

            align-items: center;
            /* flex-start | flex-end | center | baseline | stretch */

            align-content: center;
            /* flex-start | flex-end | center | space-between | space-around | stretch */

            gap: 15px;
            /* Space between flex items */
        }


        /* FLEX ITEM PROPERTIES*/
        .box {
            width: 120px;
            height: 120px;
            border: 3px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;

            /* The following 3 are part of Flexbox core: */
            flex-grow: 0;
            /* how much item can grow */
            flex-shrink: 1;
            /* how much item can shrink */
            flex-basis: 120px;
            /* initial width before growing/shrinking */

            /* Shorthand for grow, shrink, basis */
            flex: 0 1 120px;
            /* (same as above) */

            align-self: auto;
            /* flex-start | flex-end | center | baseline | stretch */
        }


        /* COLORS */
        #box1 {
            background: aqua;
        }

        #box2 {
            background: blueviolet;
            color: white;
        }

        #box3 {
            background: yellow;
        }

        #box4 {
            background: tomato;
            color: white;
        }

        #box5 {
            background: lightgreen;
        }

        #box6 {
            background: gold;
        }
    </style>
</head>

<body>

    <h1>ALL FLEXBOX PROPERTIES (Beginner-Friendly)</h1>

    <div id="container">
        <div id="box1" class="box">Item 1</div>
        <div id="box2" class="box">Item 2</div>
        <div id="box3" class="box">Item 3</div>
        <div id="box4" class="box">Item 4</div>
        <div id="box5" class="box">Item 5</div>
        <div id="box6" class="box">Item 6</div>
    </div>

</body>

</html>
