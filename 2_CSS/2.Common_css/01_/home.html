<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Flexbox Properties</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
        }

        /* FLEX CONTAINER (ALL PROPERTIES)*/
        #container {
            width: 90%;
            min-height: 300px;
            border: 3px solid red;
            padding: 10px;
            margin: 20px auto;

            display: flex;

            flex-direction: row;
            /* row | row-reverse | column | column-reverse */

            flex-wrap: wrap;
            /* nowrap | wrap | wrap-reverse */

            flex-flow: row wrap;
            /* shorthand for direction + wrap */

            justify-content: center;
            /* flex-start | flex-end | center | space-between | space-around | space-evenly */

            align-items: center;
            /* flex-start | flex-end | center | baseline | stretch */

            align-content: center;
            /* flex-start | flex-end | center | space-between | space-around | stretch */

            /* GAP FAMILY */
            gap: 15px;
            /* shorthand */
            row-gap: 15px;
            column-gap: 15px;
        }


        /* FLEX ITEM (ALL PROPERTIES) */
        .box {
            width: 120px;
            height: 120px;
            border: 3px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;

            order: 0;
            /* default order */

            flex-grow: 0;
            /* how much item grows */
            flex-shrink: 1;
            /* how much item shrinks */
            flex-basis: 120px;
            /* base width */

            flex: 0 1 120px;
            /* shorthand: grow shrink basis */

            align-self: auto;
            /* flex-start | flex-end | center | baseline | stretch */
        }

        /* COLORS */
        #box1 {
            background: aqua;
        }

        #box2 {
            background: blueviolet;
            color: white;
        }

        #box3 {
            background: yellow;
        }

        #box4 {
            background: tomato;
            color: white;
        }

        #box5 {
            background: lightgreen;
        }

        #box6 {
            background: gold;
        }
    </style>
</head>

<body>

    <h1>ALL FLEXBOX PROPERTIES (100% COMPLETE)</h1>

    <div id="container">
        <div id="box1" class="box">Item 1</div>
        <div id="box2" class="box">Item 2</div>
        <div id="box3" class="box">Item 3</div>
        <div id="box4" class="box">Item 4</div>
        <div id="box5" class="box">Item 5</div>
        <div id="box6" class="box">Item 6</div>
    </div>

</body>

</html>
